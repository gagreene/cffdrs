name: Release

# Publishing uses PyPI "Trusted Publishing" (OIDC) — no API tokens stored in the
# repo. Before first use, register this repo+workflow as a trusted publisher:
#   PyPI     -> project "cffdrs" -> Publishing -> add GitHub publisher
#   TestPyPI -> same, for the testpypi environment
#
# Flow:
#   - Manual run (workflow_dispatch)  -> build, test, publish to TestPyPI
#   - Tag push v* (e.g. v0.1.0)       -> build, test, publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tags; a shallow, tagless
          # checkout would misversion the build.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - name: Run test suite
        run: |
          uv sync --extra test --extra dev
          uv run pytest -q
          uv run ruff check src/
          uv run mypy
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
