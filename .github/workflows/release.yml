name: Release

# Publishing uses PyPI Trusted Publishing (OIDC); no API tokens are stored in
# the repository. Manual runs publish to TestPyPI, while v* tags publish to PyPI.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version=$(awk -F '"' '/^version = / { print $2; exit }' rust/crates/cffdrs-py/Cargo.toml)
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Build editable package and run test suite
        run: |
          uv sync --extra test --extra dev
          uv run pytest -q
          uv run ruff check src/
          uv run mypy
      - name: Rust format, lint, docs and tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path rust/Cargo.toml --workspace --no-deps
          cargo test --manifest-path rust/Cargo.toml --workspace

  # The MSRV is declared once, as rust-version in rust/Cargo.toml; read it from
  # there so this job cannot drift from the manifest.
  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' rust/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-sdist
          path: dist/*

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel builds the x86_64 wheel (macos-13 was retired in Dec 2025);
        # macos-latest builds the arm64 wheel.
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build native wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release --locked --compatibility pypi --out dist
            --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python-version) || 'python' }}
          manylinux: "2_17"
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  # Install each built wheel into a clean virtual environment outside the
  # checkout and exercise it, so a wheel that builds but cannot import or run
  # (missing extension, wrong tag, broken binding) blocks publication.
  test-wheels:
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/smoke_test_wheel.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/dist
      - name: Install the wheel into a clean virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/venv/Scripts/python.exe"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          "$PY" -m pip install "$RUNNER_TEMP"/dist/*.whl
          echo "VENV_PY=$PY" >> "$GITHUB_ENV"
      - name: Smoke-test the installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/tools/smoke_test_wheel.py" .
          "$VENV_PY" -I smoke_test_wheel.py

  check-distributions:
    needs: [build-sdist, build-wheels, test-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true
      - name: Check package metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-and-test, check-distributions]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, check-distributions]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
