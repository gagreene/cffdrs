[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cffdrs"
dynamic = ["version"]
description = "Canadian Forest Fire Danger Rating System (CFFDRS) tools: Fire Behaviour Prediction (FBP) and Fire Weather Index (FWI) systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gregory A. Greene", email = "map.n.trowel@gmail.com" }]
keywords = ["wildfire", "fire behaviour", "CFFDRS", "FBP", "FWI", "forestry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Raster / tabular I/O used by the multiprocessing driver's callers and tooling.
io = ["rasterio>=1.3", "pandas>=2.0"]
# Everything needed to run the test suite.
test = ["pytest>=7", "pandas>=2.0", "openpyxl>=3.1", "rasterio>=1.3"]
# Linting and type checking.
dev = ["ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/gagreene/cffdrs"
Repository = "https://github.com/gagreene/cffdrs"

[tool.hatch.version]
path = "src/cffdrs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cffdrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
# 3.12 so mypy can parse numpy's stubs; runtime still targets >=3.10.
python_version = "3.12"
# Scoped to the pure, typed equation core. The facade's dynamic getParams dict and
# the heterogeneous list-building in parallel.py are intentionally out of the strict
# gate for now (don't chase dynamically-shaped masked-array internals);
# cffwis/diurnal remain legacy/untyped.
files = [
    "src/cffdrs/_typing.py",
    "src/cffdrs/cffbps/constants.py",
    "src/cffdrs/cffbps/equations",
]
# Parked (incremental typing debt): inputs.py, facade.py, parallel.py — heavy
# masked-array narrowing / dynamic dict access that fights numpy's stubs.
ignore_missing_imports = true
