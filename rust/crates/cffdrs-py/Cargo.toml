[package]
name = "cffdrs-py"
# Python distribution version; 0.2.0 exposes the stateful pipeline API.
version = "0.2.0"
edition.workspace = true
description = "Python bindings (cffdrs._rust) over cffbps-rust."
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
cffbps-rust = { path = "../cffbps-rust" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"] }
numpy = "0.27"
