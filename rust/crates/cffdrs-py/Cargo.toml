[package]
name = "cffdrs-py"
# Deliberately not bumped with cffdrs-core 0.2.0: this line is the Python
# distribution version (the release workflow's tag check reads it), and the
# Python API did not break.
version = "0.1.0"
edition.workspace = true
description = "Python bindings (cffdrs._rust) over cffdrs-core."
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
cffdrs-core = { path = "../cffdrs-core" }
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
