[package]
name = "cffdrs-py"
# Deliberately not bumped with cffbps-rust 0.2.0: this line is the Python
# distribution version (the release workflow's tag check reads it), and the
# Python API did not break.
version = "0.1.0"
edition.workspace = true
description = "Python bindings (cffdrs._rust) over cffbps-rust."
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
cffbps-rust = { path = "../cffbps-rust" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"] }
numpy = "0.27"
