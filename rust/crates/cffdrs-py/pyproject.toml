[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cffdrs-rs"
description = "Compiled CFFDRS FBP core with Python bindings. The cffdrs Python package remains the reference implementation; this wheel is the performance backend."
requires-python = ">=3.10"
dynamic = ["version"]

[tool.maturin]
module-name = "cffdrs_rs"
