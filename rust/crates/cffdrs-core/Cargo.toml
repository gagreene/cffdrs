[package]
name = "cffdrs-core"
version = "0.2.0"
edition.workspace = true
description = "Pure-Rust implementation of the CFFDRS FBP equations (scalar core + grid pass), mirroring the cffdrs Python package in this repository."
license.workspace = true
rust-version.workspace = true
repository.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "LICENSE*"]

[lints]
workspace = true

[dependencies]
# deliberately none: the core is dependency-free Rust

[dev-dependencies]
serde_json = "1"
